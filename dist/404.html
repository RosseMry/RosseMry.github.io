<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // GitHub Pages has no real server-side routing, so a direct visit or a
      // refresh on a route like /cv/work 404s here. This repacks the intended
      // path into a query string and bounces back to index.html, which
      // unpacks it (see the inline script in index.html) before React Router
      // ever looks at the URL. pathSegmentsToKeep=1 matches the one project-page
      // segment ("/cv") in src/basename.ts — keep both in sync if the repo is renamed.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
